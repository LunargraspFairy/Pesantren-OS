<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}SiPesantren - Sistem Informasi Pondok Pesantren{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <script defer src="https://unpkg.com/alpinejs@3.14.3/dist/cdn.min.js"></script>
  <script src="/static/js/photo-compressor.js"></script>
  <script src="/static/js/sse-client.js"></script>
  <style>
    :root {
      --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
      --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);
      --ease-drawer: cubic-bezier(0.32, 0.72, 0, 1);
    }
    .btn-interactive {
      transition: transform 160ms var(--ease-out), opacity 160ms var(--ease-out), background-color 160ms var(--ease-out);
    }
    .btn-interactive:active {
      transform: scale(0.97);
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    @media print {
      body { background-color: #ffffff !important; color: #000000 !important; }
      .no-print { display: none !important; }
      .print-only { display: block !important; }
      .page-break { page-break-before: always; }
      table { border-collapse: collapse !important; width: 100% !important; }
      th, td { border: 1px solid #334155 !important; }
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col font-sans antialiased">
  <header class="no-print bg-emerald-950 text-white border-b border-emerald-900 sticky top-0 z-50 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <a href="/" class="flex items-center space-x-3 btn-interactive">
          <img src="{{ logo_url }}" alt="Logo Pondok Pesantren" class="h-10 w-10 rounded-md object-contain bg-white p-0.5 border border-emerald-800/30 shadow-xs" />
          <div>
            <div class="font-bold text-lg tracking-tight text-white leading-none">SiPesantren</div>
            <div class="text-xs text-emerald-300 font-medium">Lembaga Kepengasuhan & Akademik</div>
          </div>
        </a>
      </div>

      <nav class="flex items-center space-x-2 text-sm font-medium">
        <a href="/alur" class="btn-interactive px-3 py-1.5 rounded-md text-emerald-100 hover:text-white hover:bg-emerald-900 transition">Papan Alur Publik</a>
        <a href="/login" class="btn-interactive px-3 py-1.5 rounded-md text-emerald-100 hover:text-white hover:bg-emerald-900 transition">Masuk Portal</a>
        <form action="/auth/logout" method="POST" class="inline">
          <button type="submit" class="btn-interactive px-3 py-1.5 rounded-md bg-emerald-900 hover:bg-emerald-800 text-emerald-100 hover:text-white transition text-xs border border-emerald-800">Keluar</button>
        </form>
      </nav>
    </div>
  </header>

  <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6">
    {% block content %}{% endblock %}
  </main>

  <footer class="no-print bg-white border-t border-slate-200 mt-auto py-4 text-xs text-slate-600 text-center">
    <div class="max-w-7xl mx-auto px-4">
      SiPesantren — Sistem Informasi Akademik, Tahfidz, Kesantrian & Sambang. Non-Financial System.
    </div>
  </footer>
</body>
</html>
